  body.dark {

  }

    padding: 36px 20px 60px; box-sizing: border-box;
    color: var(--primary-text-color);
  }
  .toolbar { display: flex; gap: 10px; align-items: center; font-size: 13px; opacity: .85; }
  .toolbar button {
    border: 1px solid var(--divider-color); background: var(--ha-card-background);
    color: inherit; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px;
  }
  .frame { width: 100%; max-width: 420px; }
  .caption { font-size: 12px; text-align: center; opacity: .6; margin-top: 6px; }
  /* 截图模式: ?plain=1 去掉工具栏与页边距，整页只留卡片 */
  body.plain { display: block; padding: 10px 0; gap: 0; }
  body.plain .toolbar, body.plain .caption, body.plain #tip { display: none !important; }
  body.plain .frame { max-width: 420px; margin: 0 auto; }
</style>

  // 卡片元素由下面的 module 脚本注册，要等它定义完再喂数据，否则 setConfig 还不存在
  const qs = new URLSearchParams(location.search);
  if (qs.get("theme") === "dark") document.body.classList.add("dark");
  if (qs.get("plain") === "1") document.body.classList.add("plain");
  // 截图用: 整体缩放，让整张卡片放进一屏
  const zoom = parseFloat(qs.get("zoom") || "");
  if (zoom > 0) document.documentElement.style.zoom = String(zoom);

  customElements.whenDefined("kaiyuan-gas-card").then(() => {
    const card = document.getElementById("card");
    card.setConfig({ entity: "sensor.kaiyuan_records", show_ladder: true });
    card.hass = {
      states,
      callService: (d, s, data) => console.log("callService", d, s, data),
    };
    const view = qs.get("view");
    if (view && view !== "main" && typeof card._go === "function") card._go(view);
  });

  document.getElementById("theme").addEventListener("click", () => {
    document.body.classList.toggle("dark");
  });

  // lit 需要从 HA 内置或 CDN 加载；纯离线打开时会拿不到，这里给个提示而不是空白
  setTimeout(() => {
    if (!customElements.get("kaiyuan-gas-card")) {
      const tip = document.getElementById("tip");
      if (tip) tip.hidden = false;
    }
  }, 3000);
